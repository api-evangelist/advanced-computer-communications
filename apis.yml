name: Advanced Computer Communications
description: 'Advanced Computer Communications (ACC), founded as Associated Computer Consultants, was a
  data networking equipment vendor based in Santa Barbara, California. The company began by building IMP
  interfaces for the ARPANET — initially for IBM 360 mainframes and later for DEC PDP-11 minicomputers —
  and grew into a maker of wide-area internetworking products for the interconnection and management of
  distributed computer networks, including carrier-class routers and integrated remote-access gear. In
  1990 it sold its ACCES/MVS native TCP/IP stack for MVS to Interlink Computer Sciences. Ericsson agreed
  to acquire ACC in 1998 for approximately USD 285 million in cash and completed the acquisition that same
  year, after which ACC ceased to exist as an independent company. ACC predates the public web API era and
  never operated a developer program, public API, or developer portal; no successor developer surface
  exists under the ACC name today.'
